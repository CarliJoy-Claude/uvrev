repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format .
        language: system
        pass_filenames: false

      - id: ruff-fix
        name: ruff fix
        entry: uv run ruff check --fix --quiet --exit-zero .
        language: system
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false

      - id: pytest-tests
        name: pytest (tests)
        entry: uv run pytest tests
        language: system
        pass_filenames: false

      - id: pytest-doctest
        name: pytest (doctest src)
        entry: uv run pytest --doctest-modules src
        language: system
        pass_filenames: false

