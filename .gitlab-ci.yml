stages:
  - test
  - build
  - attest
  - publish

# Template: https://docs.astral.sh/uv/guides/integration/gitlab/#using-the-uv-image
# Key points:
# - Use ghcr.io/astral-sh/uv:<UV_VERSION>-python<UV_PYTHON>-<BASE_LAYER>
# - Set UV_LINK_MODE=copy for GitLab’s mount behavior
variables:
  UV_VERSION: "0.13.6"
  BASE_LAYER: "trixie"
  UV_LINK_MODE: "copy"
  UV_CACHE_DIR: "${CI_PROJECT_DIR}/.uv-cache"
  UV_FROZEN: "true"
  UV_PYTHON_DOWNLOADS: "false"
  UV_PYTHON_PREFERENCE: "system"

default:
  image: "ghcr.io/astral-sh/uv:${UV_VERSION}-python${UV_PYTHON}-${BASE_LAYER}"
  cache:
    - key:
        files:
          - uv.lock
        prefix: "uv-${UV_PYTHON}"
      paths:
        - $UV_CACHE_DIR

# -------------------------
# Tests (matrix 3.12..3.15)
# -------------------------
test:
  stage: test
  parallel:
    matrix:
      - UV_PYTHON: ["3.12", "3.13", "3.14", "3.15"]
  script:
    - uv run prek run --all-files
  # Total coverage shown in merge requests, pipelines and the coverage badge
  coverage: '/^\s*TOTAL\s.*\s(\d+(?:\.\d+)?)%$/'

  after_script:
    # Recommended by Astral to keep cache size under control in CI
    - uv cache prune --ci
  artifacts:
    when: always
    paths:
      - htmlcov/
      - coverage.xml
      - junit-*.xml
    reports:
      junit: junit-*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# -------------------------
# Release to PyPI (tags only): build -> attest -> publish
# The jobs are separate, so each holds only the OIDC token it needs.
# -------------------------
build:dist:
  stage: build
  variables:
    UV_PYTHON: "3.12"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - uv build
  artifacts:
    paths:
      - dist/

# Sign the distributions with Sigstore, creating PEP 740 attestations
# (dist/*.publish.attestation). PyPI shows them as provenance.
# See https://docs.pypi.org/attestations/producing-attestations/
attest:pypi:
  stage: attest
  variables:
    UV_PYTHON: "3.12"
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build:dist
  # sigstore picks up SIGSTORE_ID_TOKEN as ambient credential on GitLab
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - uvx --from "pypi-attestations==0.0.30" pypi-attestations sign dist/*
  artifacts:
    paths:
      - dist/

publish:pypi:
  stage: publish
  variables:
    UV_PYTHON: "3.12"
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - attest:pypi
  # Request an OIDC token from GitLab with the audience expected by PyPI ("pypi")
  # This matches PyPI's GitLab Trusted Publishing guidance.
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  environment:
    name: 'release'
    url: 'https://pypi.org/project/uvrev'
  script:
    # If your tooling expects CI_JOB_JWT_V2, map the token (safe no-op if unused).
    - export CI_JOB_JWT_V2="$PYPI_ID_TOKEN"

    # Refuse to publish without attestations, uv would silently upload without them
    - ls dist/*.whl.publish.attestation dist/*.tar.gz.publish.attestation

    # Publish using Trusted Publishing (OIDC). No API token needed if PyPI Trusted Publisher is configured.
    # uv uploads the matching dist/*.publish.attestation files together with the distributions.
    - uv publish --trusted-publishing=always
  artifacts:
    when: always
    paths:
      - dist/
