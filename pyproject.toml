[project]
name = "uvrev"
dynamic = ["version"]
description = "uv env manager to enable conda-style revision tracking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Carli* Freudenberg", email = "kound@posteo.de" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8",
    "filelock>=3.12",
    "httpx2",
    "packaging>=25.0",
    "platformdirs>=4",
    "tomlkit>=0.13",
    "typed-settings>=26",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://gitlab.com/Kound/uvrev"
Documentation = "https://gitlab.com/Kound/uvrev/-/blob/main/README.md"
Changelog = "https://gitlab.com/Kound/uvrev/-/tags"
Issues = "https://gitlab.com/Kound/uvrev/-/issues"
"Source Code" = "https://gitlab.com/Kound/uvrev"


[project.scripts]
uvrev = "uvrev:cli.cli"

[build-system]
requires = ["hatchling>=1.28.0,<2", "hatch-vcs>=0.5.0,<0.6"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.13.1",
    "mypy>=1.19.1",
    "prek>=0.5.7",
    "pytest>=9.0.2",
    "pytest-dependency>=0.6.0",
    "ruff>=0.14.11",
]
# Sign releases in CI: PEP 740 attestations for PyPI
attestations = [
    "pypi-attestations>=0.0.30",
]

[tool.pytest.ini_options]
markers = [
    "network: needs access to PyPI",
]

[tool.coverage.run]
branch = true
source = ["src", "tests"]
parallel = true

# CI tests the installed (non-editable) package: report its files as src/uvrev
[tool.coverage.paths]
source = [
    "src/uvrev",
    "*/site-packages/uvrev",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "assert_never\\(.*\\)",
]


[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py312"
line-length = 88

# Exclude common non-source paths
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "RUF",   # Ruff-specific rules
    # Security related
    "S",     # flake8-bandit
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "DTZ",   # flake8-datetimez
    "G",     # flake8-logging-format
    "LOG",   # flake8-logging
    "PGH",   # pygrep-hooks (no blanket noqa / type: ignore)
    "T10",   # flake8-debugger
    "YTT",   # flake8-2020
    # Correctness and style
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "ERA",   # eradicate (commented-out code)
    "EXE",   # flake8-executable
    "FA",    # flake8-future-annotations
    "FURB",  # refurb
    "ICN",   # flake8-import-conventions
    "ISC",   # flake8-implicit-str-concat
    "N",     # pep8-naming
    "PERF",  # Perflint
    "PIE",   # flake8-pie
    "PL",    # Pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops
]

ignore = [
    "E203",    # whitespace before ':' (Black compatibility)
    "E266",    # too many leading '#' for block comment
    "E501",    # line length handled by formatter
    # Flags every subprocess call. All calls pass argument tuples, never shell=True,
    # so there is no shell injection. S602/S604/S605 still catch shell usage.
    "S603",
    "PLR0913", # too many arguments: click commands get one parameter per option
    "PLR0917", # too many positional arguments: same as PLR0913
    "TRY003",  # long messages in raise: the code base uses descriptive messages
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Tests can be more permissive
"tests/**" = [
    "S101",    # assert usage
    "PLR2004", # magic values
    "S607",    # uv and git are started from PATH, like in uvrev itself
    "ARG",     # fixtures are often requested only for their side effects
]

[tool.hatch.version]
source = "vcs"

[tool.mypy]
strict = true
